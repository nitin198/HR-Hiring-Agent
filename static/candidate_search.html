<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Search by JD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/candidate_search.css">
</head>
<body>
    <div class="page-shell">
        <header class="search-header card shadow-sm">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <h1 class="h4 mb-1">
                            <i class="bi bi-diagram-3 me-2"></i>Candidate Search by Job Description
                        </h1>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-refresh" class="btn btn-primary"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
                    </div>
                </div>
            </div>
        </header>

        <section class="filters card shadow-sm mt-3">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-lg-3 col-md-6">
                        <label class="form-label">Job Description</label>
                        <select id="filter-jd" class="form-select">
                            <option value="">All JDs</option>
                        </select>
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label class="form-label">Candidate Search</label>
                        <input id="filter-q" class="form-control" type="text" placeholder="Name or email">
                    </div>
                    <div class="col-lg-2 col-md-6">
                        <label class="form-label">Decision</label>
                        <select id="filter-decision" class="form-select">
                            <option value="">All</option>
                            <option value="strong_hire">Strong Hire</option>
                            <option value="borderline">Borderline</option>
                            <option value="hold">Hold</option>
                            <option value="reject">Reject</option>
                        </select>
                    </div>
                    <div class="col-lg-2 col-md-6">
                        <label class="form-label">Rows per Section</label>
                        <select id="filter-limit" class="form-select">
                            <option value="25">25</option>
                            <option value="50" selected>50</option>
                            <option value="100">100</option>
                            <option value="200">200</option>
                        </select>
                    </div>
                    <div class="col-lg-2 col-md-6">
                        <div class="form-check mb-2">
                            <input id="filter-unassigned" class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label" for="filter-unassigned">Include No JD Match</label>
                        </div>
                        <button id="btn-apply" class="btn btn-success w-100">
                            <i class="bi bi-search me-1"></i>Apply Filters
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="summary mt-3" id="summary-cards"></section>

        <section class="results mt-3">
            <div id="loading" class="loading-state d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted mb-0">Loading ranked candidates...</p>
            </div>
            <div id="results-container"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/config.js"></script>
    <script src="/static/candidate_search.js"></script>
</body>
</html>
